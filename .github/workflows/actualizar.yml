name: Actualizar datos
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && 'Actualizar datos · manual'
  || github.event.schedule == '20 4 * * 0' && 'Actualizar datos · semanal'
  || 'Actualizar datos · diaria' }}${{ (inputs.informe || github.event.schedule == '20 4 * * 0') && ' · con informe' || '' }}

# Cada día (lunes a sábado, a las 04:20 UTC y a las 22:40 UTC):
# descarga las votaciones y las iniciativas nuevas, las procesa, genera con DeepSeek las fichas de lo
# nuevo y publica la web con los datos del día. En el repositorio guarda solo las fichas generadas
# (data/llm, texto pequeño), que es lo que no se puede volver a descargar.
# Cada domingo, además: redacta el informe de análisis de la portada y guarda en el repositorio la
# base troceada (data/bd) y los datos de la web (web/datos). Así el historial de git no suma cada día
# una copia binaria de la base. Lanzado a mano, lo guarda todo.
#
# Configuración en Settings > Secrets and variables > Actions:
#   Secret   DEEPSEEK_API_KEY   clave de la API de DeepSeek (sin ella se actualiza todo menos las fichas nuevas)
#   Variable DEEPSEEK_MODEL     modelo (opcional; por defecto deepseek-flash)
#   Variable LIMITE_ACTAS       actas que lee con DeepSeek cada ejecución programada (opcional; por defecto 150)
#
# La misma actualización puede lanzarla cualquier persona desde su equipo, con la clave en un fichero
# .env: README, «Actualizar los datos: en la nube o en local». Los dos caminos parten del mismo
# repositorio y dejan en él el resultado.
#
# Tiempo: la actualización se da MINUTOS_MAX y reparte ese tiempo entre sus fases (escrutinio/plazo.py);
# lo que no da tiempo a hacer queda para la ejecución siguiente. Así termina sola, guarda y publica antes
# de que GitHub corte el trabajo, que perdería todo lo hecho. Al final deja en la ejecución un aviso con
# lo que ha tardado cada fase.
# Entre ejecuciones se conserva la base de trabajo en la caché de Actions: cada día sigue donde lo dejó
# el anterior, en vez de rehacer desde data/bd todo lo de la semana. Cuando cambia data/bd (el domingo,
# o si alguien sube una actualización hecha en su equipo), la caché no vale y se reconstruye desde ahí.

on:
  schedule:
    # 04:20 UTC (06:20 en verano y 05:20 en invierno, hora peninsular): recoge los plenos del día
    # anterior. 22:40 UTC: recoge las votaciones del mismo día (los martes se vota hasta las 21:00, hora
    # peninsular) y cubre el caso de que GitHub retrase o descarte la de la mañana, que le pasa al cron.
    # Las dos empiezan fuera de las horas punta de DeepSeek (01:00-04:00 y 06:00-10:00 UTC, de lunes a
    # viernes, a precio doble). Una pasada sin novedades gasta poco; el grupo de concurrencia impide que
    # se solapen.
    - cron: "20 4 * * 1-6"   # diaria, mañana
    - cron: "40 22 * * 1-6"  # diaria, noche
    - cron: "20 4 * * 0"     # semanal (domingo)
  workflow_dispatch:
    inputs:
      limite_fichas:
        description: "Máximo de fichas nuevas en esta ejecución"
        default: "400"
      informe:
        description: "Regenerar el informe de análisis con DeepSeek"
        type: boolean
        default: false
      limite_actas:
        description: "Máximo de diarios de sesiones y actas autonómicas y locales que leer con DeepSeek (vacío: sin límite, hasta que se acabe el tiempo)"
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Semanal (domingo) o manual: se guarda en el repositorio la base y los datos de la web.
      COMPLETA: ${{ github.event_name != 'schedule' || github.event.schedule == '20 4 * * 0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Herramientas PDF (actas autonómicas)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # La clave depende de data/bd tal como está en el repositorio: si cambia, la base guardada ya no vale.
      - name: Recuperar la base de trabajo de la ejecución anterior
        id: base
        uses: actions/cache/restore@v5
        with:
          path: data/escrutinio.sqlite*
          key: base-${{ hashFiles('data/bd/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: base-${{ hashFiles('data/bd/**') }}-

      - name: Actualizar
        id: actualizar
        # Red de seguridad por si algo se atasca fuera del control del plazo: quedan minutos para guardar.
        timeout-minutes: 105
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          MINUTOS_MAX: "95"
          PYTHONUNBUFFERED: "1"
        # Las programadas leen como mucho LIMITE_ACTAS actas cada una: el atraso se reparte en más días en vez de
        # gastarse de golpe. Lanzada a mano, lo que diga el formulario (vacío: sin límite).
        run: |
          python -m escrutinio actualizar \
            --limite-fichas "${{ inputs.limite_fichas || '400' }}" \
            ${{ github.event_name == 'schedule' && format('--limite-actas {0}', vars.LIMITE_ACTAS || '150') || inputs.limite_actas && format('--limite-actas {0}', inputs.limite_actas) || '' }} \
            ${{ (inputs.informe || github.event.schedule == '20 4 * * 0') && '--informe' || '' }}

      # La web se publica con los datos recién calculados, también los días que no se guardan en git.
      # Se prepara antes de guardar: así sale con el mismo código que ha calculado los datos.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      # También si la actualización ha fallado o se ha cortado: lo que ya se ha pagado a DeepSeek (data/llm) no se
      # pierde. En ese caso solo se guarda data/llm, que se escribe a medida que llega.
      - name: Guardar cambios en el repositorio
        if: always() && steps.actualizar.outcome != 'skipped'
        env:
          RESULTADO: ${{ steps.actualizar.outcome }}
        run: |
          if [ "$RESULTADO" != "success" ]; then COMPLETA=false; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/llm
          if [ "$COMPLETA" = "true" ]; then git add data/bd web/datos; fi
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualización automática de datos parlamentarios ($(date -u +%F))"
            # Lo que no se guarda (data/bd y web/datos los días normales) se aparta: con cambios sin
            # guardar, git no deja traer los commits subidos mientras se actualizaba.
            git stash push --include-untracked --quiet || true
            git pull --rebase origin main
            git push
          fi

      # Los días que no se guarda data/bd: la base de hoy, para que mañana siga desde aquí. Los días que sí se
      # guarda, la próxima ejecución la reconstruye desde data/bd, que es lo mismo.
      - name: Guardar la base de trabajo para la próxima ejecución
        if: always() && steps.actualizar.outcome != 'skipped' && env.COMPLETA != 'true'
        uses: actions/cache/save@v5
        with:
          path: data/escrutinio.sqlite*
          key: ${{ steps.base.outputs.cache-primary-key }}

  publicar:
    needs: actualizar
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
